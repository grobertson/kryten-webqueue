[project]
name = "kryten-webqueue"
version = "0.37.0"
description = "Netflix/Tubi-style catalog browser and pay-to-play queue management for CyTube"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "grobertson" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
    "pillow>=10.0",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "yt-dlp>=2024.1",
    "openpyxl>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-slugify>=8.0",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
kryten-webqueue = "kryten_webqueue.__main__:main"
kryten-webqueue-fetchurls-auth = "kryten_webqueue.jobs.fetchurls_auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kryten_webqueue"]

[tool.hatch.build.targets.wheel.shared-data]
"deploy/nginx-queue.conf" = "share/kryten-webqueue/nginx-queue.conf"
"deploy/kryten-webqueue.service" = "share/kryten-webqueue/kryten-webqueue.service"
"config.example.json" = "share/kryten-webqueue/config.example.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
