<img id="motd-img" src="{{ banner_url|safe_url }}" alt style="display:block;margin:0 auto;border:4px solid #6c0dbf2" />

<div class="weekend-body">
    <div class="weekend-content">
        <div class="weekend-title">
            🟥🟧🟨🟩{{ headline }}🟩🟨🟧🟥
        </div>
        {{ movie_grid() }}
{% if show_next_event and next_event %}
        <div class="weekend-title">🟥🟧🟨🟩Up next: {{ next_event.label }}{% if next_event.starts_in %} — {{ next_event.starts_in }}{% endif %}🟩🟨🟧🟥</div>
{% endif %}
{% for link in links %}
        <div class="weekend-title">🟥🟧🟨🟩<a href="{{ link.url|safe_url }}" target="_new">{{ link.label }}</a>🟩🟨🟧🟥</div>
{% endfor %}
        {{ zone("promo") }}
    </div>
</div>
