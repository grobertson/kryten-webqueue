{% extends "base.html" %}
{% block title %}Live Race{% endblock %}
{% block body_class %}race-page{% endblock %}

{% block head %}
<style>
  .race-wrap { max-width: 900px; margin: 0 auto; }
  .race-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .race-head h1 { font-family: 'Sora', sans-serif; margin: 0; }
  .race-status { font-weight: 600; opacity: 0.85; }
  .race-status .pill { padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; }
  .pill-betting { background: #1f6feb33; color: #79c0ff; }
  .pill-racing  { background: #2ea04333; color: #7ee787; }
  .pill-finished{ background: #d2992233; color: #f0c674; }
  .pill-idle    { background: #6e768166; color: #c9d1d9; }

  .race-track { margin: 1.25rem 0; display: flex; flex-direction: column; gap: 0.55rem; }
  .lane {
    position: relative; display: grid; grid-template-columns: 2.4rem 1fr auto;
    align-items: center; gap: 0.6rem; padding: 0.35rem 0.5rem; border-radius: 10px;
    background: #11141a; border: 1px solid #232a33;
  }
  .lane.win { border-color: #f0c674; box-shadow: 0 0 0 1px #f0c67455, 0 0 18px #f0c67433; }
  .lane-pos { font-weight: 700; text-align: center; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .lane-rail { position: relative; height: 26px; background: #0c0e12; border-radius: 6px; overflow: hidden; }
  .lane-fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: linear-gradient(90deg, #1f6feb44, #1f6feb22);
    transition: width 1.4s linear; border-right: 2px solid #ffffff22;
  }
  .lane-runner {
    position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%);
    font-size: 1.15rem; transition: left 1.4s linear; will-change: left;
    text-shadow: 0 1px 2px #000a;
  }
  .lane-meta { display: flex; align-items: baseline; gap: 0.5rem; }
  .lane-name { font-weight: 600; }
  .lane-odds { font-size: 0.8rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .lane-trait { font-size: 0.72rem; opacity: 0.6; }
  .lane-amt { font-size: 0.75rem; opacity: 0.7; font-variant-numeric: tabular-nums; }

  .race-side { display: flex; gap: 1.5rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .race-side .stat b { font-size: 1.1rem; }
  .race-winner { margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 10px;
    background: #d2992218; border: 1px solid #f0c67455; }
  .race-winner h2 { margin: 0 0 0.35rem; font-family: 'Sora', sans-serif; }
  .race-payouts { margin: 0.25rem 0 0; padding-left: 1.1rem; }
  .race-idle { text-align: center; opacity: 0.7; padding: 3rem 1rem; }
  .race-finish-flag { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    font-size: 0.95rem; opacity: 0.5; }
</style>
{% endblock %}

{% block content %}
<div class="race-wrap">
  <div class="race-head">
    <h1>🏁 Live Race</h1>
    <div class="race-status" id="race-status"><span class="pill pill-idle">Connecting…</span></div>
  </div>

  <div id="race-body">
    <div class="race-idle" id="race-idle">Waiting for the next race…</div>
    <div class="race-track" id="race-track" hidden></div>
    <div class="race-side" id="race-side" hidden></div>
    <div class="race-winner" id="race-winner" hidden></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const statusEl = document.getElementById('race-status');
  const idleEl   = document.getElementById('race-idle');
  const trackEl  = document.getElementById('race-track');
  const sideEl   = document.getElementById('race-side');
  const winnerEl = document.getElementById('race-winner');

  const lanes = new Map();   // color -> { row, fill, runner, pos, amt }
  let laneSig = '';          // signature of the current racer set (to detect changes)

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
    ));
  }

  function setStatus(kind, text) {
    statusEl.innerHTML = '<span class="pill pill-' + kind + '">' + esc(text) + '</span>';
  }

  function buildLanes(racers) {
    trackEl.innerHTML = '';
    lanes.clear();
    for (const r of racers) {
      const row = document.createElement('div');
      row.className = 'lane';
      row.innerHTML =
        '<div class="lane-pos"></div>' +
        '<div class="lane-rail">' +
          '<div class="lane-fill"></div>' +
          '<span class="lane-runner">' + esc(r.emoji || '🏃') + '</span>' +
          '<span class="race-finish-flag">🏁</span>' +
        '</div>' +
        '<div class="lane-meta">' +
          '<span class="lane-name">' + esc(r.color) + '</span>' +
          '<span class="lane-odds">' + esc(r.odds || '') + '</span>' +
          (r.trait ? '<span class="lane-trait">' + esc(r.trait) + '</span>' : '') +
          '<span class="lane-amt"></span>' +
        '</div>';
      trackEl.appendChild(row);
      lanes.set(r.color, {
        row,
        fill: row.querySelector('.lane-fill'),
        runner: row.querySelector('.lane-runner'),
        pos: row.querySelector('.lane-pos'),
        amt: row.querySelector('.lane-amt'),
      });
    }
  }

  function render(frame) {
    idleEl.hidden = true;
    trackEl.hidden = false;
    sideEl.hidden = false;

    // Rebuild lanes only when the racer set changes (keeps CSS transitions smooth).
    const sig = frame.racers.map(r => r.color).join('|');
    if (sig !== laneSig) { buildLanes(frame.racers); laneSig = sig; }

    const finished = frame.phase === 'finished';
    const winnerColor = frame.winner && frame.winner.color;
    const betsByColor = frame.bets_by_color || {};

    for (const r of frame.racers) {
      const lane = lanes.get(r.color);
      if (!lane) continue;
      const pct = Math.max(0, Math.min(100, r.pct || 0));
      lane.fill.style.width = pct + '%';
      lane.runner.style.left = pct + '%';
      lane.pos.textContent = r.position ? ('#' + r.position) : '';
      const bet = betsByColor[r.color];
      lane.amt.textContent = bet ? ('💰 ' + bet.amount.toLocaleString()) : '';
      lane.row.classList.toggle('win', finished && r.color === winnerColor);
    }

    // Status line
    if (frame.phase === 'betting') {
      setStatus('betting', 'Betting open — ' + (frame.betting_closes_in || 0) + 's left');
    } else if (frame.phase === 'racing') {
      setStatus('racing', 'Racing! Leader: ' + (frame.leader || '—'));
    } else if (finished) {
      setStatus('finished', 'Finished');
    }

    // Side stats
    const sym = frame.symbol || '';
    sideEl.innerHTML =
      '<div class="stat">Pool <b>' + (frame.pool || 0).toLocaleString() + ' ' + esc(sym) + '</b></div>' +
      '<div class="stat">Bettors <b>' + (frame.bettor_count || 0) + '</b></div>' +
      (frame.phase === 'betting'
        ? '<div class="stat">Min bet <b>' + (frame.min_bet || 0).toLocaleString() + ' ' + esc(sym) + '</b></div>'
        : '');

    // Winner banner + payouts
    if (finished && frame.winner) {
      const payouts = (frame.payouts || []).slice(0, 5)
        .map(p => '<li>' + esc(p.username) + ' <b>+' + (p.net || 0).toLocaleString() + ' ' + esc(sym) + '</b></li>')
        .join('');
      winnerEl.hidden = false;
      winnerEl.innerHTML =
        '<h2>' + esc(frame.winner.emoji || '🏆') + ' ' + esc(frame.winner.color) + ' wins!</h2>' +
        (payouts ? '<ul class="race-payouts">' + payouts + '</ul>'
                 : '<div>No winning bets this race.</div>');
    } else {
      winnerEl.hidden = true;
    }
  }

  function showIdle() {
    laneSig = '';
    lanes.clear();
    trackEl.hidden = true;
    sideEl.hidden = true;
    winnerEl.hidden = true;
    idleEl.hidden = false;
    setStatus('idle', 'No race running');
  }

  // ── WebSocket with auto-reconnect ──────────────────────────
  let ws = null, retry = 0, pingTimer = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws/race');

    ws.onopen = () => {
      retry = 0;
      setStatus('idle', 'Connected');
      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        try { ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {}
      }, 25000);
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'race_frame') render(m.data);
      else if (m.type === 'race_clear') showIdle();
    };
    ws.onclose = () => {
      clearInterval(pingTimer);
      setStatus('idle', 'Reconnecting…');
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, 500 * retry);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  showIdle();
  connect();
})();
</script>
{% endblock %}
