{% extends "base.html" %}
{% block title %}Schedules - Admin{% endblock %}
{% block body_class %}admin-page{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <h1>Schedules</h1>
    <p><a href="/admin">&larr; Back to Admin</a></p>

    <div id="lock-banner" class="lock-banner hidden"></div>
    <div id="active-banner" class="schedule-info hidden" style="margin-bottom:1.5rem;"></div>

    <div class="admin-section">
        <div class="section-head">
            <h2>Scheduled Events</h2>
            <button class="btn btn-primary" onclick="showScheduleModal()">+ New Schedule</button>
        </div>
        <div id="schedules-list">Loading…</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/admin-schedules.js?v={{ app_version }}"></script>
{% endblock %}
