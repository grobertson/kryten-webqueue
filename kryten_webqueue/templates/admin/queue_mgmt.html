{% extends "base.html" %}
{% block title %}Queue Management - Admin{% endblock %}
{% block body_class %}admin-page{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <h1>Queue Management</h1>
    <p><a href="/admin">&larr; Back to Admin</a></p>

    <div class="admin-section">
        <div class="section-head">
            <h2>Live Queue</h2>
            <div class="btn-group">
                <button class="btn btn-sm" onclick="showAddModal()">+ Add Item</button>
                <button class="btn btn-sm" onclick="loadQueue()">Refresh</button>
                <button class="btn btn-sm btn-danger" onclick="clearAll()">Clear Queue</button>
            </div>
        </div>
        <div id="np-line" class="muted" style="margin-bottom:0.75rem;"></div>
        <div id="queue-table">Loading…</div>
    </div>

    <div class="admin-section">
        <div class="section-head">
            <h2>Catalog Sync</h2>
            <button class="btn btn-sm" onclick="syncNow()">Sync Now</button>
        </div>
        <div id="sync-logs">Loading…</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/admin-queue-mgmt.js?v={{ app_version }}"></script>
{% endblock %}
