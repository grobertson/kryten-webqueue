{% extends "base.html" %}
{% block title %}Queue{% endblock %}
{% block body_class %}queue-page{% endblock %}

{% block content %}
<div class="queue-layout">
    <div class="now-playing-section">
        <h2>Now Playing</h2>
        <div id="now-playing" class="now-playing-card">
            <p class="empty-state">Connecting...</p>
        </div>
    </div>

    <div class="queue-section">
        <div class="queue-section-header">
            <h2>Up Next</h2>
            <label class="toggle-switch" title="Hide items before the currently playing one">
                <input type="checkbox" id="hide-previous-toggle" onchange="toggleHidePrevious(this.checked)" checked>
                <span class="toggle-slider"></span>
                <span>Hide Previous</span>
            </label>
        </div>
        <div id="queue-list" class="queue-list">
            <p class="empty-state">Connecting...</p>
        </div>
        <div id="queue-summary" class="queue-summary"></div>
    </div>

    <div class="queue-info-sidebar">
        <div id="schedule-info" class="schedule-info hidden">
            <h3>Scheduled Playlist</h3>
            <p id="schedule-label"></p>
            <p id="schedule-time"></p>
            <p id="schedule-countdown" class="muted"></p>
        </div>
        <div class="queue-stats">
            <p>Status: <span id="ws-status" class="ws-disconnected">● Disconnected</span></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let ws = null;
let reconnectTimer = null;
let hidePrevious = true;
let lastState = null;

function toggleHidePrevious(checked) {
    hidePrevious = checked;
    if (lastState) renderQueue(lastState);
}

function connectWebSocket() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
        const el = document.getElementById('ws-status');
        el.className = 'ws-connected';
        el.textContent = '● Live';
    };

    ws.onclose = () => {
        const el = document.getElementById('ws-status');
        el.className = 'ws-disconnected';
        el.textContent = '● Disconnected';
        reconnectTimer = setTimeout(connectWebSocket, 3000);
    };

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'queue_state' || msg.type === 'queue_update') {
            renderQueue(msg.data);
            maybeInitialScroll(msg.data);
        } else if (msg.type === 'pong') {
            // keepalive ack
        } else if (msg.type === 'schedule_fired') {
            showToast(`Scheduled playlist loaded: ${msg.data.playlist_name}`);
            if (typeof loadNextSchedule === 'function') loadNextSchedule();
        }
    };

    // Keepalive
    setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({type: 'ping'}));
        }
    }, 30000);
}

function renderQueue(state) {
    lastState = state;
    const npEl = document.getElementById('now-playing');
    const qlEl = document.getElementById('queue-list');
    const sumEl = document.getElementById('queue-summary');

    if (state.now_playing) {
        const np = state.now_playing;
        const elapsed = Number(np.currentTime) || 0;
        // CyTube's now-playing payload uses numeric `seconds` for the total
        // runtime (`duration` is a preformatted "HH:MM:SS" string).
        const total = Number(np.seconds ?? np.duration_sec ?? 0) || 0;
        const remaining = Math.max(0, total - elapsed);
        const pct = total > 0 ? (elapsed / total * 100) : 0;
        const cats = Array.isArray(np.categories) ? np.categories : [];
        const tags = Array.isArray(np.tags) ? np.tags : [];
        const chips = [
            ...cats.map(c => `<span class="np-chip np-chip-cat">${escapeHtml(c)}</span>`),
            ...tags.map(t => `<span class="np-chip np-chip-tag">${escapeHtml(t)}</span>`),
        ].join('');
        npEl.innerHTML = `
            <h3 class="np-title">${escapeHtml(np.title || 'Unknown')}</h3>
            <div class="np-body">
                <div class="np-cover">${coverHtml(np)}</div>
                <div class="np-info">
                    ${np.paid_by ? `<div class="np-meta"><span class="np-user">Queued by ${escapeHtml(np.paid_by)}</span></div>` : ''}
                    <div class="np-time">${formatTime(elapsed)} / ${formatTime(total)}</div>
                    <div class="np-progress">
                        <div class="progress-bar" style="width: ${pct}%"></div>
                    </div>
                    <div class="np-remaining">${formatTime(remaining)} remaining</div>
                </div>
            </div>
            ${np.description ? `<div class="np-description">${escapeHtml(String(np.description).replace(/\r\n?/g, '\n'))}</div>` : ''}
            ${chips ? `<div class="np-chips">${chips}</div>` : ''}
        `;
    } else {
        npEl.innerHTML = '<p class="empty-state">Nothing playing</p>';
    }

    if (state.items && state.items.length > 0) {
        const totalDuration = state.items.reduce((sum, i) => sum + (i.duration_sec || 0), 0);
        sumEl.innerHTML = `<span>${state.items.length} items · ${formatTime(totalDuration)} total</span>`;

        const nowUid = state.now_playing && state.now_playing.uid != null
            ? String(state.now_playing.uid) : null;
        const nowIndex = nowUid != null
            ? state.items.findIndex(it => String(it.uid) === nowUid) : -1;
        qlEl.innerHTML = state.items
            .map((item, i) => ({ item, i }))
            .filter(({ i }) => !(hidePrevious && nowIndex >= 0 && i < nowIndex))
            .map(({ item, i }) => `
            <div class="queue-item ${item.is_pay ? 'queue-item-paid' : ''} ${nowUid != null && String(item.uid) === nowUid ? 'queue-item-now-playing' : ''}" data-uid="${item.uid}">
                <span class="qi-drag" title="Drag to reorder">☰</span>
                <span class="qi-pos">${i + 1}</span>
                <div class="qi-cover">${coverHtml(item)}</div>
                <div class="qi-info">
                    <span class="qi-title">${escapeHtml(item.title || 'Unknown')}</span>
                    <span class="qi-meta">
                        ${item.paid_by ? `<span class="qi-user">by ${escapeHtml(item.paid_by)}</span>` : ''}
                        ${item.is_pay ? `<span class="qi-badge badge-paid">${escapeHtml(item.tier || '')}</span>` : ''}
                    </span>
                </div>
                <div class="qi-right">
                    <span class="qi-duration">${formatTime(item.duration_sec || 0)}</span>
                    ${item.estimated_start_at ? `<span class="qi-eta">~${formatEta(item.estimated_start_at)}</span>` : ''}
                </div>
            </div>
        `).join('');
    } else {
        qlEl.innerHTML = '<p class="empty-state">Queue is empty</p>';
        sumEl.innerHTML = '';
    }
}

// On first render with live data, bring the now-playing card into view.
let didInitialScroll = false;
function maybeInitialScroll(state) {
    if (didInitialScroll || !state || !state.now_playing) return;
    didInitialScroll = true;
    const sec = document.querySelector('.now-playing-section');
    if (sec) {
        setTimeout(() => sec.scrollIntoView({behavior: 'smooth', block: 'start'}), 150);
    }
}

function formatTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function coverHtml(item) {
    if (item.cover_art_path) {
        return `<img src="/images/${item.cover_art_path}/200.webp" alt="" loading="lazy">`;
    }
    if (item.thumbnail_url) {
        return `<img src="${escapeHtml(item.thumbnail_url)}" alt="" loading="lazy">`;
    }
    const letter = (item.title || '?').trim().charAt(0) || '?';
    return `<div class="cover-placeholder">${escapeHtml(letter)}</div>`;
}

function formatEta(isoStr) {
    // Server emits UTC ISO timestamps. If a value arrives without an explicit
    // timezone designator, treat it as UTC so the browser converts it to the
    // viewer's local timezone rather than misreading it as local time.
    let s = String(isoStr);
    if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(s)) {
        s += 'Z';
    }
    const d = new Date(s);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Initial load via HTTP (in case WS takes a moment)
async function initialLoad() {
    try {
        const resp = await fetch('/queue/state', {credentials: 'same-origin'});
        if (resp.ok) {
            const state = await resp.json();
            renderQueue(state);
            maybeInitialScroll(state);
        }
    } catch (e) { /* WS will take over */ }
}

initialLoad();
connectWebSocket();

// ---- Upcoming scheduled playlist announcement ----
let nextSchedule = null;

async function loadNextSchedule() {
    try {
        const resp = await fetch('/queue/next-schedule', {credentials: 'same-origin'});
        if (!resp.ok) return;
        const s = await resp.json();
        nextSchedule = (s && s.fire_at) ? s : null;
        renderScheduleBanner();
    } catch (e) { /* ignore */ }
}

function renderScheduleBanner() {
    const box = document.getElementById('schedule-info');
    if (!nextSchedule) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    document.getElementById('schedule-label').textContent = nextSchedule.label || 'Scheduled playlist';
    document.getElementById('schedule-time').textContent =
        'Fires ' + (typeof formatLocalDateTime === 'function'
            ? formatLocalDateTime(nextSchedule.fire_at) : nextSchedule.fire_at);
    const cd = document.getElementById('schedule-countdown');
    const fireMs = new Date(nextSchedule.fire_at).getTime();
    const diff = fireMs - Date.now();
    if (isNaN(fireMs)) { cd.textContent = ''; return; }
    if (diff <= 0) { cd.textContent = 'Starting…'; return; }
    const mins = Math.floor(diff / 60000), hrs = Math.floor(mins / 60);
    const rem = mins % 60;
    const human = hrs > 0 ? `${hrs}h ${rem}m` : `${mins}m`;
    cd.textContent = nextSchedule.lock_active
        ? `Pay-to-play is closed — starts in ${human}`
        : `Starts in ${human}`;
}

loadNextSchedule();
setInterval(renderScheduleBanner, 30000);   // refresh countdown
setInterval(loadNextSchedule, 120000);      // re-fetch schedule periodically
</script>
{% endblock %}
