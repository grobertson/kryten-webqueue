server {
    listen 443 ssl;
    http2 on;
    server_name queue.dropsugar.co;

    ssl_certificate     /etc/letsencrypt/live/queue.dropsugar.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queue.dropsugar.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128it-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # WebSocket upgrade
    location /ws {
        proxy_pass http://127.0.0.1:2010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API + pages
    location / {
        proxy_pass http://127.0.0.1:2010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets - serve directly for performance
    location /static/ {
        alias /opt/kryten-webqueue/kryten_webqueue/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cover art images
    location /images/ {
        alias /var/lib/kryten-webqueue/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name queue.dropsugar.co;
    return 301 https://$host$request_uri;
}
