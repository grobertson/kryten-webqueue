server {
    listen 443 ssl;
    http2 on;
    server_name queue.dropsugar.co;

    ssl_certificate     /etc/letsencrypt/live/queue.dropsugar.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queue.dropsugar.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128it-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Upstream application backend:
    # - Live (chandra-1 Podman container): http://chandra-1.local:2010
    # - Local grindhouse service (legacy):  http://127.0.0.1:2010
    #
    # The app serves its own persistent-volume media over these paths, so they
    # are proxied like any other request rather than served from a local alias:
    #   /emotes/images/...  -> app mount of emote_rehost.static_dir
    #   /motd/boxes/...     -> app mount of motd.poster_dir
    # A local `alias` would only work if this host could see the container's
    # volume, which it cannot.

    # WebSocket upgrade
    location /ws {
        proxy_pass http://chandra-1.local:2010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Weekend MOTD poster art. Filenames are content-unique
    # (custom-<week>-<slot>-<token><ext>, art-<date>-<night>-<position>.<ext>),
    # so they can be cached hard; the art itself is never overwritten in place.
    location /motd/boxes/ {
        proxy_pass http://chandra-1.local:2010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rehosted channel emotes (app-served from the persistent volume).
    location /emotes/images/ {
        proxy_pass http://chandra-1.local:2010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Admin media library uploads (app-served from the persistent volume).
    # URLs are never reused, but a deleted file must stop serving, so no
    # "immutable" here; the app sets nosniff and a one-day max-age.
    location /media/ {
        proxy_pass http://chandra-1.local:2010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + pages
    location / {
        proxy_pass http://chandra-1.local:2010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets - serve directly for performance
    location /static/ {
        alias /opt/kryten-webqueue/kryten_webqueue/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cover art images
    location /images/ {
        alias /var/lib/kryten-webqueue/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name queue.dropsugar.co;
    return 301 https://$host$request_uri;
}
